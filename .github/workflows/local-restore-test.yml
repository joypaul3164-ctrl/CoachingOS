name: Local Restore Test

on:
  push:
    branches:
      - feature/showcase-smart-exam-admission
    paths:
      - ".github/workflows/local-restore-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    name: Restore preserved CoachingOS schema in isolated Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4

      - name: Checkout preserved backup branch
        uses: actions/checkout@v4
        with:
          ref: backup/pre-security-2026-11-18
          path: backup-source
          fetch-depth: 1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Build a complete, ordered migration set
        shell: bash
        run: |
          set -euo pipefail
          test -s backup-source/supabase/schema.sql
          mapfile -t source_migrations < <(find backup-source/supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)
          test "${#source_migrations[@]}" -eq 25

          mkdir -p restore-lab
          cd restore-lab
          supabase init
          mkdir -p supabase/migrations

          # Restore the original base tables before dependent feature migrations.
          cp ../backup-source/supabase/schema.sql supabase/migrations/20261116000000_coachingos_base_schema.sql

          declare -A sequence_by_day=()
          for source in "${source_migrations[@]}"; do
            filename="${source##*/}"
            day="${filename%%_*}"
            migration_name="${filename#*_}"
            case "$day" in
              20261117|20261118) ;;
              *) echo "Unexpected migration date prefix: $filename"; exit 1 ;;
            esac
            sequence=$(( ${sequence_by_day[$day]:-0} + 1 ))
            sequence_by_day[$day]=$sequence
            version="${day}$(printf '%06d' "$sequence")"
            cp "../$source" "supabase/migrations/${version}_${migration_name}"
          done

          count=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)
          test "$count" -eq 26
          versions=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | cut -d_ -f1)
          duplicates=$(printf '%s\n' "$versions" | sort | uniq -d)
          test -z "$duplicates"
          echo "Prepared base schema plus 25 uniquely versioned migrations."

      - name: Start isolated local Supabase stack
        working-directory: restore-lab
        run: supabase start

      - name: Restore base schema and all preserved migrations
        working-directory: restore-lab
        run: supabase db reset --local

      - name: Verify restored schema and core security
        working-directory: restore-lab
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          export PGPASSWORD=postgres
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"

          TABLES=$(psql "$DB_URL" -Atc "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'")
          FUNCTIONS=$(psql "$DB_URL" -Atc "select count(*) from information_schema.routines where routine_schema='public' and routine_type='FUNCTION'")
          RLS_TABLES=$(psql "$DB_URL" -Atc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relrowsecurity")
          echo "Public tables: $TABLES"
          echo "Public functions: $FUNCTIONS"
          echo "RLS-enabled tables: $RLS_TABLES"
          test "$TABLES" -gt 0
          test "$FUNCTIONS" -gt 0
          test "$RLS_TABLES" -gt 0

          for table in institutes institute_members coachingos_records; do
            exists=$(psql "$DB_URL" -Atc "select to_regclass('public.$table') is not null")
            test "$exists" = "t"
            rls=$(psql "$DB_URL" -Atc "select relrowsecurity from pg_class where oid='public.$table'::regclass")
            test "$rls" = "t"
          done

          echo "Core CoachingOS tables exist and have Row Level Security enabled."

      - name: Stop disposable local stack
        if: always()
        working-directory: restore-lab
        run: supabase stop --no-backup
